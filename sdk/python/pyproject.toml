[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controldb"
version = "0.1.0"
description = "ControlDB SDK: replayable, queryable, tamper-evident audit trail for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "ControlDB"}]
dependencies = [
  "httpx>=0.24,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21"]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]

[tool.setuptools.packages.find]
where = ["."]
include = ["controldb*"]
