[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controldb-collector"
version = "0.1.0"
description = "ControlDB collector: audit ingestion, replay, policy, approvals, evidence export."
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.108",
  "uvicorn[standard]>=0.27",
  "pydantic>=2,<3",
  "sqlalchemy>=2,<3",
  "httpx>=0.24",
  "pyyaml>=6",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
test = ["pytest>=7", "pytest-asyncio>=0.21"]

[tool.setuptools.packages.find]
where = ["."]
include = ["controldb_collector*"]
