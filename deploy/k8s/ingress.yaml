apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: controldb
  namespace: controldb
  labels:
    app.kubernetes.io/name: controldb
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Uncomment for TLS termination via cert-manager:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts:
  #       - controldb.example.com
  #     secretName: controldb-tls
  rules:
    - host: controldb.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: controldb
                port:
                  name: http
