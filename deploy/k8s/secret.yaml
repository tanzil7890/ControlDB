apiVersion: v1
kind: Secret
metadata:
  name: controldb-secret
  namespace: controldb
  labels:
    app.kubernetes.io/name: controldb
  annotations:
    # Replace all values with base64-encoded production secrets before applying.
    # echo -n 'your-secret' | base64
type: Opaque
stringData:
  CONTROLDB_JWT_SECRET: "REPLACE_ME_jwt_secret_min_32_chars"
  CONTROLDB_ENCRYPTION_KEY: "REPLACE_ME_encryption_key_32_chars"
  CONTROLDB_BOOTSTRAP_API_KEYS: "REPLACE_ME_api_key_1,REPLACE_ME_api_key_2"
