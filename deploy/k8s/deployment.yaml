apiVersion: apps/v1
kind: Deployment
metadata:
  name: controldb
  namespace: controldb
  labels:
    app.kubernetes.io/name: controldb
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: controldb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: controldb
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: controldb
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: collector
          image: ghcr.io/controldb/collector:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: controldb-config
          env:
            - name: CONTROLDB_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: controldb-secret
                  key: CONTROLDB_JWT_SECRET
            - name: CONTROLDB_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: controldb-secret
                  key: CONTROLDB_ENCRYPTION_KEY
            - name: CONTROLDB_BOOTSTRAP_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: controldb-secret
                  key: CONTROLDB_BOOTSTRAP_API_KEYS
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: controldb-data
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: controldb
                topologyKey: kubernetes.io/hostname
