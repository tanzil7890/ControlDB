apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "controldb.fullname" . }}-config
  labels:
    {{- include "controldb.labels" . | nindent 4 }}
data:
  CONTROLDB_PUBLIC_URL: {{ .Values.config.publicUrl | quote }}
  CONTROLDB_ENABLE_DASHBOARD: {{ .Values.config.enableDashboard | quote }}
  CONTROLDB_POLICIES_DIR: {{ .Values.config.policiesDir | quote }}
  CONTROLDB_OBJECT_STORE_DIR: {{ .Values.config.objectStoreDir | quote }}
  CONTROLDB_BOOTSTRAP_ORG_ID: {{ .Values.config.bootstrapOrgId | quote }}
  CONTROLDB_BOOTSTRAP_PROJECT_ID: {{ .Values.config.bootstrapProjectId | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  {{- if not .Values.database.existingSecret }}
  CONTROLDB_DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
