{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "controldb.fullname" . }}-secret
  labels:
    {{- include "controldb.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  CONTROLDB_JWT_SECRET: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
  CONTROLDB_ENCRYPTION_KEY: {{ required "secrets.encryptionKey is required" .Values.secrets.encryptionKey | quote }}
  CONTROLDB_BOOTSTRAP_API_KEYS: {{ .Values.secrets.bootstrapApiKeys | quote }}
{{- end }}
